syntax = "proto3";

package bench;

option go_package = "github.com/hrmeetsingh/go-perf/examples/gen/bench";

// BenchService exposes four RPC methods with intentionally varied performance
// characteristics to demonstrate go-perf's benchmarking capabilities.
service BenchService {
  // FastEcho returns the message immediately. Base latency ~2ms with random
  // spikes on 1-in-10 requests.
  rpc FastEcho(EchoRequest) returns (EchoResponse);

  // ProcessOrder simulates order processing with latency proportional to
  // payload size and user tier. Has 1-in-10 latency spikes.
  rpc ProcessOrder(OrderRequest) returns (OrderResponse);

  // StreamEvents server-streams N event messages back to the client. Each
  // message has ~10ms latency with 1-in-5 spike messages.
  rpc StreamEvents(StreamRequest) returns (stream EventMessage);

  // BidirectionalChat is a full bidi stream where each received message is
  // echoed back after a delay. Delay varies by user tier.
  rpc BidirectionalChat(stream ChatMessage) returns (stream ChatMessage);
}

message EchoRequest {
  string message   = 1;
  string user_tier = 2; // "premium" | "standard" | "free"
}

message EchoResponse {
  string message    = 1;
  int64  latency_ms = 2;
}

message OrderRequest {
  string order_id  = 1;
  string user_tier = 2; // "premium" | "standard" | "free"
  double amount    = 3;
  bytes  payload   = 4; // arbitrary payload — larger = slower processing
}

message OrderResponse {
  string order_id     = 1;
  string status       = 2;
  int64  processed_at = 3;
}

message StreamRequest {
  string topic     = 1;
  int32  count     = 2; // number of events to stream
  string user_tier = 3;
}

message EventMessage {
  string event_id  = 1;
  string topic     = 2;
  string data      = 3;
  int64  timestamp = 4;
}

message ChatMessage {
  string sender    = 1;
  string text      = 2;
  string user_tier = 3; // "premium" | "standard" | "free"
  int64  timestamp = 4;
}
