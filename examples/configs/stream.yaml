# Bidirectional streaming benchmark — 30 seconds, 5 concurrent streams.
# Demonstrates bidi stream support with configurable send rate.
target: "localhost:50051"
proto: "examples/bench.proto"

concurrency: 5
duration: "30s"
timeout: "35s"

calls:
  - call: "bench.BenchService/BidirectionalChat"
    dynamic_fields:
      - field: "user_tier"
        type: "pool"
        values: ["premium", "standard", "free"]
      - field: "text"
        type: "string"
        length: 16
      - field: "sender"
        type: "uuid"

stream:
  send_rate: 50
  stream_count: 5

output:
  formats: ["cli", "json"]
  dir: "./reports/stream"
