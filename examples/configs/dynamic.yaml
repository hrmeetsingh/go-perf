# Dynamic payload benchmark — demonstrates per-call dynamic_fields with
# two calls run in parallel. The report shows per-call, per-tier latency
# breakdown. Use the payload-hash drill-down to see which tier causes spikes.
target: "localhost:50051"
proto: "examples/bench.proto"

concurrency: 15
total: 600
timeout: "5s"
parallel: true

calls:
  - call: "bench.BenchService/FastEcho"
    dynamic_fields:
      - field: "user_tier"
        type: "pool"
        values: ["premium", "standard", "free"]
      - field: "message"
        type: "string"
        length: 24

  - call: "bench.BenchService/ProcessOrder"
    dynamic_fields:
      - field: "user_tier"
        type: "pool"
        values: ["premium", "standard", "free"]
      - field: "order_id"
        type: "uuid"

output:
  formats: ["cli", "html", "json"]
  dir: "./reports/dynamic"
